name: Deploy published website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare interface with immutable snapshot URLs
        run: |
          python - <<'PY'
          import os, pathlib, re, shutil, json
          root=pathlib.Path('.');out=root/'_pages';out.mkdir()
          for item in root.iterdir():
              if item.is_file() and item.suffix in {'.html','.js','.css'}:shutil.copy2(item,out/item.name)
          shutil.copytree(root/'vendor',out/'vendor')
          (out/'.nojekyll').write_text('')
          commit=os.environ['GITHUB_SHA'];repo=os.environ['GITHUB_REPOSITORY']
          config={'mode':'snapshot','live_api':'https://liangce-v3-api-production.up.railway.app','data_base':f'https://raw.githubusercontent.com/{repo}/{commit}/'}
          (out/'web-config.js').write_text('window.LIANGCE_WEB_CONFIG='+json.dumps(config)+';\n')
          index=out/'index.html';index.write_text(re.sub(r'\?v=[a-f0-9]+', '?v='+commit, index.read_text()))
          print('Pages interface bytes:',sum(p.stat().st_size for p in out.rglob('*') if p.is_file()))
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const artifact = (await github.rest.actions.listWorkflowRunArtifacts({owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId})).data.artifacts.find(a => a.name === 'github-pages' && !a.expired);
            if (!artifact) throw new Error('Pages artifact missing');
            const oidc = await core.getIDToken();
            core.setSecret(oidc);
            const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {owner: context.repo.owner, repo: context.repo.repo, artifact_id: artifact.id, pages_build_version: context.sha, oidc_token: oidc});
            core.setOutput('page_url', created.data.page_url);
            const deadline = Date.now() + 20 * 60 * 1000;
            let previous = '', errors = 0;
            while (Date.now() < deadline) {
              try {
                const current = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}', {owner: context.repo.owner, repo: context.repo.repo, pages_deployment_id: created.data.id});
                const state = current.data.status;
                errors = 0;
                if (state !== previous) { core.info('Pages state: ' + state); previous = state; }
                if (state === 'succeed') return;
                if (['deployment_failed','deployment_perms_error','deployment_content_failed','deployment_cancelled','deployment_lost'].includes(state)) throw new Error('Pages terminal state: ' + state);
              } catch (error) {
                if (String(error.message).includes('terminal state') || ++errors >= 10) throw error;
                core.warning('Temporary Pages status request failed; retrying');
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', {owner: context.repo.owner, repo: context.repo.repo, pages_deployment_id: created.data.id});
            throw new Error('Pages file synchronization exceeded 20 minutes');
